<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العين للدعاية والإعلان | لوحة الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#FFFFFF;
    --bg-soft:#FAF8F3;
    --surface:#FFFFFF;
    --surface-2:#F3F0E8;
    --border:rgba(20,16,8,.10);
    --border-soft:rgba(20,16,8,.06);
    --text:#171310;
    --text-dim:#6E6656;
    --text-faint:#A39B87;
    --gold:#B8862E;
    --gold-2:#D9AE55;
    --gold-soft:rgba(184,134,46,.12);
    --black:#111111;
    --black-soft:rgba(17,17,17,.06);
    --pos:#8A6D1D;
    --neg:#A63A3A;
    --neg-soft:rgba(166,58,58,.10);
    --radius:14px;
    --radius-sm:9px;
    --shadow: 0 14px 34px rgba(20,16,8,.10);
  }
  html[data-theme="dark"]{
    --bg:#131110;
    --bg-soft:#1B1815;
    --surface:#1E1B18;
    --surface-2:#28241F;
    --border:rgba(255,255,255,.09);
    --border-soft:rgba(255,255,255,.055);
    --text:#F2EEE6;
    --text-dim:#B7AF9E;
    --text-faint:#8C8474;
    --gold:#D9AE55;
    --gold-2:#EAC978;
    --gold-soft:rgba(217,174,85,.16);
    --black:#0A0908;
    --black-soft:rgba(255,255,255,.08);
    --pos:#C9A227;
    --neg:#E07A7A;
    --neg-soft:rgba(224,122,122,.14);
    --shadow: 0 14px 34px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1000px 520px at 90% -8%, rgba(217,174,85,.10), transparent 60%),
      radial-gradient(800px 460px at -8% 100%, rgba(17,17,17,.04), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    font-variant-numeric: tabular-nums;
    transition:background-color .25s ease, color .25s ease;
  }
  h1,h2,h3,.brand-name{font-family:'Cairo', sans-serif;}
  ::selection{background:var(--gold-soft);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:10px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- Splash ---------- */
  .splash{
    position:fixed;inset:0;background:var(--bg);z-index:300;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    transition:opacity .5s ease, visibility .5s ease;
  }
  .splash img{width:min(260px,55vw);animation:pop .7s ease;}
  .splash .sname{font-family:'Cairo';font-weight:800;font-size:19px;color:var(--text);letter-spacing:.3px;text-align:center;}
  .splash .sload{font-size:12px;color:var(--text-faint);margin-top:2px;}
  .splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
  @keyframes pop{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}

  /* ---------- Shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:252px;flex:0 0 252px;
    background:var(--bg-soft);
    border-left:1px solid var(--border);
    display:flex;flex-direction:column;
    padding:20px 16px;position:sticky;top:0;height:100vh;
    z-index:40;
    transition:transform .25s ease;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:4px 4px 18px;border-bottom:1px solid var(--border-soft);margin-bottom:14px;}
  .brand img{width:38px;flex:0 0 38px;}
  .brand-name{font-size:14.5px;font-weight:800;line-height:1.35;color:var(--text);}
  .brand-sub{font-size:11px;color:var(--text-faint);font-weight:500;margin-top:2px;letter-spacing:.3px;}

  nav.tabs{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;}
  .tab-btn{
    display:flex;align-items:center;gap:10px;
    background:transparent;border:1px solid transparent;color:var(--text-dim);
    font-family:'Tajawal';font-size:14px;font-weight:500;
    padding:10px 11px;border-radius:var(--radius-sm);cursor:pointer;text-align:right;
    transition:.15s;
  }
  .tab-btn svg{width:17px;height:17px;flex:0 0 17px;opacity:.8;}
  .tab-btn:hover{background:var(--surface-2);color:var(--text);}
  .tab-btn.active{background:var(--black);color:var(--gold-2);border-color:var(--black);font-weight:700;}
  .tab-btn .count{margin-right:auto;font-size:10.5px;color:var(--text-faint);background:var(--surface-2);padding:1px 7px;border-radius:20px;}
  .tab-btn.active .count{color:var(--gold-2);background:rgba(255,255,255,.12);}

  .sidebar-foot{padding-top:12px;border-top:1px solid var(--border-soft);margin-top:8px;}
  .save-status{font-size:11px;color:var(--text-faint);display:flex;align-items:center;gap:6px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--pos);}
  .theme-toggle{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);font-family:'Tajawal';font-weight:700;font-size:12.5px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:.15s;}
  .theme-toggle:hover{background:var(--black);color:var(--gold-2);border-color:var(--black);}
  .theme-toggle svg{width:14px;height:14px;flex:0 0 14px;}

  .main{flex:1;min-width:0;padding:26px 32px 60px;}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
  .page-title{font-size:24px;font-weight:800;margin:0;}
  .page-sub{color:var(--text-dim);font-size:13px;margin-top:4px;}
  .menu-toggle{display:none;}

  .search-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:5px 6px 5px 12px;box-shadow:0 2px 8px rgba(20,16,8,.04);}
  .search-bar input{border:none;background:transparent;font-family:'Tajawal';font-size:13.5px;width:200px;color:var(--text);}
  .search-bar input:focus{outline:none;}
  .search-bar button{background:var(--black);color:var(--gold-2);border:none;border-radius:8px;padding:8px 14px;font-family:'Tajawal';font-weight:700;font-size:12.5px;cursor:pointer;}

  /* ---------- Stat cards ---------- */
  .home-entrance{animation:homeReveal .75s cubic-bezier(.2,.75,.25,1) both;}
  .home-entrance .stat-card{animation:cardReveal .65s cubic-bezier(.2,.75,.25,1) both;}
  .home-entrance .stat-card:nth-child(2){animation-delay:.06s;}
  .home-entrance .stat-card:nth-child(3){animation-delay:.12s;}
  .home-entrance .stat-card:nth-child(4){animation-delay:.18s;}
  .home-entrance .stat-card:nth-child(5){animation-delay:.24s;}
  .home-entrance .stat-card:nth-child(6){animation-delay:.30s;}
  @keyframes homeReveal{from{opacity:0;transform:translateY(18px) scale(.985);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes cardReveal{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  #content.content-enter{animation:homeReveal .55s cubic-bezier(.2,.75,.25,1) both;}
  #content.content-enter .stat-card{animation:cardReveal .55s cubic-bezier(.2,.75,.25,1) both;}
  #content.content-enter .stat-card:nth-child(2){animation-delay:.05s;}
  #content.content-enter .stat-card:nth-child(3){animation-delay:.10s;}
  #content.content-enter .stat-card:nth-child(4){animation-delay:.15s;}
  #content.content-enter .stat-card:nth-child(5){animation-delay:.20s;}
  #content.content-enter .stat-card:nth-child(6){animation-delay:.25s;}
  #content.content-enter .section-card,
  #content.content-enter .panel,
  #content.content-enter .notice-bar,
  #content.content-enter .promo-switch{animation:cardReveal .5s cubic-bezier(.2,.75,.25,1) both;animation-delay:.08s;}
  #content.content-enter tbody tr{animation:rowReveal .4s ease both;}
  #content.content-enter tbody tr:nth-child(1){animation-delay:.05s;}
  #content.content-enter tbody tr:nth-child(2){animation-delay:.08s;}
  #content.content-enter tbody tr:nth-child(3){animation-delay:.11s;}
  #content.content-enter tbody tr:nth-child(4){animation-delay:.14s;}
  #content.content-enter tbody tr:nth-child(5){animation-delay:.17s;}
  #content.content-enter tbody tr:nth-child(6){animation-delay:.20s;}
  #content.content-enter tbody tr:nth-child(n+7){animation-delay:.22s;}
  @keyframes rowReveal{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px;margin-bottom:24px;}
  .stat-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:17px 17px 15px;position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(20,16,8,.03);
  }
  .stat-card.hi{border-color:rgba(184,134,46,.4);background:linear-gradient(150deg,rgba(217,174,85,.08),transparent 60%);}
  .stat-label{font-size:12px;color:var(--text-dim);font-weight:600;}
  .stat-value{font-size:23px;font-weight:800;margin-top:8px;font-family:'Cairo';}
  .stat-value.gold{color:var(--gold);}
  .stat-value.pos{color:var(--pos);}
  .stat-value.neg{color:var(--neg);}
  .stat-value.black{color:var(--black);}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:19px 19px 8px;margin-bottom:20px;box-shadow:0 2px 10px rgba(20,16,8,.03);}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;flex-wrap:wrap;gap:8px;}
  .panel-title{font-size:14.5px;font-weight:800;color:var(--text);}
  .panel-note{font-size:12px;color:var(--text-faint);}
  .breakdown{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;}
  .brow{display:flex;align-items:center;gap:12px;}
  .brow .blabel{width:150px;flex:0 0 150px;font-size:12.5px;color:var(--text-dim);}
  .bar-track{flex:1;height:9px;border-radius:6px;background:var(--surface-2);overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;background:var(--gold);}
  .brow .bval{width:110px;flex:0 0 110px;text-align:left;font-size:12.5px;font-weight:700;color:var(--text);}

  .notice-bar{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    background:var(--gold-soft);border:1px solid rgba(184,134,46,.28);border-radius:12px;
    padding:12px 16px;margin-bottom:16px;font-size:13px;
  }
  .notice-bar b{color:var(--gold);font-family:'Cairo';font-size:15px;}

  /* ---------- Table section ---------- */
  .section-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:22px;box-shadow:0 2px 10px rgba(20,16,8,.03);}
  .section-head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px;}
  .section-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:9px;}
  .section-title .swatch{width:9px;height:9px;border-radius:3px;background:var(--gold);}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--black);color:var(--gold-2);border:1px solid var(--black);
    font-family:'Tajawal';font-weight:700;font-size:13px;padding:9px 15px;border-radius:9px;cursor:pointer;
    transition:.15s;
  }
  .btn:hover{opacity:.85;}
  .btn.ghost{background:transparent;border-color:var(--border);color:var(--text-dim);}
  .btn.ghost:hover{background:var(--surface-2);color:var(--text);}
  .btn.sm{padding:6px 10px;font-size:12px;}
  .btn.danger{background:var(--neg-soft);color:var(--neg);border-color:rgba(166,58,58,.3);}
  .btn.whatsapp{background:#25D366;border-color:#25D366;color:#fff;}
  .btn.whatsapp:hover{opacity:.88;}
  .msg-block{display:flex;flex-direction:column;gap:8px;}
  .msg-block+.msg-block{margin-top:18px;padding-top:18px;border-top:1px dashed var(--border);}
  .msg-block-label{font-weight:800;font-size:13.5px;color:var(--gold);font-family:'Cairo';}
  .msg-block pre{white-space:pre-wrap;word-break:break-word;font-family:'Tajawal';font-size:13.5px;background:var(--bg-soft);border:1px solid var(--border);border-radius:9px;padding:14px;max-height:38vh;overflow-y:auto;margin:0;line-height:1.75;}
  .msg-block-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:700px;}
  thead th{
    text-align:right;font-size:11.5px;color:var(--text-faint);font-weight:700;
    padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg-soft);
    position:sticky;top:0;
  }
  tbody td{padding:11px 12px;border-bottom:1px solid var(--border-soft);white-space:nowrap;font-size:13px;}
  tbody tr:hover{background:var(--bg-soft);}
  tbody tr:last-child td{border-bottom:none;}
  tfoot .totals-row td{background:var(--gold-soft);border-top:2px solid var(--gold);font-weight:800;color:var(--text);padding:11px 12px;position:sticky;bottom:0;}
  tfoot .totals-row td:first-child{color:var(--gold-2);}
  td.pos{color:var(--pos);font-weight:700;}
  td.neg{color:var(--neg);font-weight:700;}
  td.dim{color:var(--text-faint);}
  td.badge-cell span{background:var(--surface-2);padding:3px 9px;border-radius:20px;font-size:11.5px;}
  td.badge-cell span.ok{background:rgba(138,109,29,.12);color:var(--pos);}
  td.badge-cell span.no{background:var(--neg-soft);color:var(--neg);}
  .row-actions{display:flex;align-items:center;gap:10px;white-space:nowrap;}
  .edit-link{color:var(--gold);font-weight:700;font-size:12.5px;cursor:pointer;text-decoration:none;}
  .edit-link:hover{text-decoration:underline;}
  .del-link{color:var(--neg);font-weight:700;font-size:12.5px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:3px;}
  .del-link:hover{text-decoration:underline;}
  .mini-link{color:var(--pos);font-weight:700;font-size:12px;cursor:pointer;background:rgba(138,109,29,.1);padding:5px 9px;border-radius:7px;white-space:nowrap;}
  .mini-link:hover{background:rgba(138,109,29,.18);}
  .del-btn{background:transparent;border:none;color:var(--text-faint);cursor:pointer;padding:5px;border-radius:7px;display:flex;}
  .del-btn:hover{background:var(--neg-soft);color:var(--neg);}
  .empty-hint{padding:26px 18px;text-align:center;color:var(--text-faint);font-size:13px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--black);border:1px solid var(--black);color:var(--gold-2);
    padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:.25s;z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width: 880px){
    .sidebar{position:fixed;right:0;top:0;transform:translateX(100%);box-shadow:var(--shadow);}
    .sidebar.open{transform:translateX(0);}
    .main{padding:18px 14px 50px;}
    .menu-toggle{display:flex;align-items:center;justify-content:center;width:38px;height:38px;background:var(--surface);border:1px solid var(--border);border-radius:9px;color:var(--text);cursor:pointer;}
    .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39;}
    .backdrop.show{display:block;}
    .search-bar input{width:120px;}
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,16,8,.45);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:150;
    opacity:0;pointer-events:none;transition:.18s;padding:20px;
  }
  .modal-overlay.show{opacity:1;pointer-events:auto;}
  .modal-box{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    width:min(460px,100%);max-height:86vh;display:flex;flex-direction:column;
    box-shadow:var(--shadow);transform:translateY(10px);transition:.18s;
  }
  .modal-overlay.show .modal-box{transform:translateY(0);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);}
  .modal-title{font-family:'Cairo';font-weight:800;font-size:15.5px;}
  .modal-close{background:transparent;border:none;color:var(--text-faint);font-size:22px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px;}
  .modal-close:hover{background:var(--surface-2);color:var(--text);}
  .modal-body{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:13px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);font-weight:600;margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;background:var(--bg-soft);border:1px solid var(--border);color:var(--text);
    font-family:'Tajawal';font-size:14px;padding:10px 12px;border-radius:9px;
  }
  .field textarea{font-family:'Tajawal';line-height:1.7;resize:vertical;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--gold);}
  .template-vars{font-size:11.5px;color:var(--text-faint);line-height:2;background:var(--bg-soft);border:1px solid var(--border-soft);border-radius:9px;padding:9px 12px;margin:6px 0 0;}
  .template-vars code{background:var(--surface-2);color:var(--gold);padding:1px 6px;border-radius:5px;font-family:'Tajawal';}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--border);}

  /* ---------- Settings ---------- */
  .settings-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding-bottom:16px;}
  .settings-row .field{flex:1;min-width:150px;margin-bottom:0;}
  .logo-preview{width:70px;height:70px;border-radius:12px;border:1px solid var(--border);background:var(--bg-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 70px;}
  .logo-preview img{max-width:100%;max-height:100%;}
  .mini-table{width:100%;border-collapse:collapse;margin-top:8px;}
  .mini-table td{padding:8px 6px;border-bottom:1px solid var(--border-soft);font-size:13px;}

  /* ---------- Promotion split tabs ---------- */
  .promo-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--surface-2);padding:5px;border:1px solid var(--border);border-radius:12px;margin-bottom:16px;}
  .promo-switch button{border:0;background:transparent;color:var(--text-dim);font-family:'Tajawal';font-weight:800;font-size:13.5px;padding:11px 12px;border-radius:9px;cursor:pointer;transition:.18s;}
  .promo-switch button:hover{background:rgba(255,255,255,.7);color:var(--text);}
  .promo-switch button.active{background:var(--black);color:var(--gold-2);box-shadow:0 3px 10px rgba(17,17,17,.10);}
  .promo-section-note{font-size:12px;color:var(--text-faint);margin:-5px 0 14px;}

  /* ---------- Search view ---------- */
  .search-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
  .client-block{margin-bottom:16px;}
  .client-block h4{font-size:13.5px;font-weight:800;margin:0 0 8px;display:flex;align-items:center;gap:8px;}
  .client-block h4 .swatch{width:8px;height:8px;border-radius:2px;background:var(--gold);}
</style>
</head>
<body>
<script>
  (function(){
    try{
      var t = localStorage.getItem('oyoun-theme');
      if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
    }catch(e){}
  })();
</script>

<div class="splash" id="splash">
  <img id="splashLogo" src="" alt="شعار العين للدعاية والإعلان">
  <div class="sname" id="splashName">العين للدعاية والإعلان</div>
  <div class="sload" id="splashLoad">جاري تحميل البيانات…</div>
</div>

<div class="shell">
  <div class="backdrop" id="backdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img id="sidebarLogo" src="" alt="شعار">
      <div>
        <div class="brand-name" id="sidebarName">العين للدعاية<br>والإعلان</div>
        <div class="brand-sub">لوحة إدارة الأعمال</div>
      </div>
    </div>

    <nav class="tabs" id="tabsNav"></nav>

    <div class="sidebar-foot">

const TABLE_COLUMN_KEYS = {
  designs: ['client','design_type','design_count','price','paid','remaining','designer_due','profit','date','notes'],
  promotion: ['client','budget_usd','exchange_rate','budget_iqd','campaign_rate','price','paid','remaining','profit','date','notes'],
};
function getTableColumns(section){
  const all = getColumns(section);
  const keys = TABLE_COLUMN_KEYS[section];
  if(!keys) return all;
  const byKey = {}; all.forEach(c=>{ byKey[c.k]=c; });
  const ordered = keys.map(k=>byKey[k]).filter(Boolean);
  const extra = (state.customColumns && state.customColumns[section]) || [];
  const extraKeys = new Set(extra.map(c=>c.key));
  const extras = all.filter(c=>extraKeys.has(c.k));
  return ordered.concat(extras);
}

async function notifyTelegramFunds(previousFunds, currentFunds){
  if (telegramNotificationInFlight) return;
  if (previousFunds === null || Number(previousFunds) === Number(currentFunds)) return;

  telegramNotificationInFlight = true;
  try{
    await fetch('/.netlify/functions/telegram', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        type:'funds_update',
        previousFunds:Number(previousFunds)||0,
        currentFunds:Number(currentFunds)||0
      })
    });
  }catch(e){
    console.warn('Telegram notification failed:', e);
  }finally{
    telegramNotificationInFlight = false;
  }
}

async function notifyTelegramWork(payload){
  try{
    const response = await fetch('/.netlify/functions/telegram', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        type:'work_notifications',
        ...payload
      })
    });
    const data = await response.json().catch(()=>({}));
    if(!response.ok || data.ok===false) console.warn('Telegram work notification failed:', data);
  }catch(e){
    console.warn('Telegram work notification failed:', e);
  }
}

function saveState(silent){

  clearTimeout(saveTimer);
  return new Promise((resolve)=>{
    saveTimer = setTimeout(async ()=>{
      try{
        suppressNextRemoteRender = true;
        const previousFunds = lastSavedAvailableFunds;
        await dataRef.set(state);
        const currentFunds = Number(grandTotals().availableFunds || 0);
        lastSavedAvailableFunds = currentFunds;
        await notifyTelegramFunds(previousFunds, currentFunds);
        setSaveStatus('ok');
        if(!silent) showToast('تم الحفظ');
      }catch(e){
        setSaveStatus('err');
      }
      resolve();
    }, silent?0:300);
  });
}
function setSaveStatus(kind){
  const el = document.getElementById('saveStatus');
  if(kind==='ok') el.innerHTML = '<span class="dot" style="background:var(--pos)"></span> محفوظ ومتزامن';
  else if(kind==='saving') el.innerHTML = '<span class="dot" style="background:var(--gold)"></span> جاري الحفظ…';
  else el.innerHTML = '<span class="dot" style="background:var(--neg)"></span> تعذر الاتصال بالخادم';
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  const duration = Math.max(1600, Math.min(5000, msg.length*45));
  showToast._t = setTimeout(()=>t.classList.remove('show'), duration);
}
function listenForRemoteChanges(){
  dataRef.on('value', (snap)=>{
    if(suppressNextRemoteRender){ suppressNextRemoteRender = false; return; }
    if(!snap.exists()) return;
    const incoming = withDefaults(snap.val());
    if(JSON.stringify(incoming) === JSON.stringify(state)) return;
    state = incoming;
    lastSavedAvailableFunds = Number(grandTotals().availableFunds || 0);
    const tag = document.activeElement && document.activeElement.tagName;
    if(tag==='INPUT' || tag==='SELECT') return;
    state = incoming;
    render();
    applyBranding();
    setSaveStatus('ok');
  }, ()=> setSaveStatus('err'));
}

/* ===================== Calculations ===================== */
function num(v){ const n = parseFloat(v); return isNaN(n)?0:n; }
function normName(s){ return (s||'').toString().trim().replace(/\s+/g,' '); }
function fmtDate(d){
  if(!d) return '';
  const parts = d.split('-');
  if(parts.length!==3) return d;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}
function addDays(dateStr, days){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function isPartnerName(person){
  return (state.partners||[]).some(p=>normName(p.name)===normName(person) && normName(p.name)!=='');
}
function companyCampaignCost(row){
  return num(row?.actual_spent) || num(row?.budget_iqd) || (num(row?.budget_usd) * (num(row?.exchange_rate) || 1380));
}
function partnerWithdrawalFromExpenses(name){
  const target = normName(name);
  if(!target) return 0;
  const expenseWithdrawals = (state.expenses||[]).reduce((sum,e)=> normName(e.person)===target ? sum+num(e.amount) : sum, 0);
  const campaignWithdrawals = (state.companyCampaigns||[]).reduce((sum,r)=>
    r.funding_source==='شريك' && normName(r.partner_name)===target ? sum+companyCampaignCost(r) : sum, 0);
  return expenseWithdrawals + campaignWithdrawals;
}

/* الربح لا يُحتسب إلا من المبلغ الذي وصل فعلاً: صافي الربح = الواصل - المستحق (بحد أدنى صفر) */
function calcProfit(paid, due){
  return num(paid) - num(due);
}
function computeRow(section, row){
  const r = {...row};
  if(section==='designs'){
    r.remaining = Math.max(0, num(r.price) - num(r.paid));
    r.profit = Math.max(0, num(r.paid) - num(r.designer_due));
  } else if(section==='promotion'){
    const budgetRate = num(r.exchange_rate) || 1380;
    r.budget_iqd = num(r.budget_usd) * budgetRate;
    // سعر الحملة = ميزانية الحملة بالدولار × سعر الحملة المختار (1400 أو 1800)
    let campaignRate = num(r.campaign_rate);
    if((r.campaign_rate||'')==='كتابة يدوياً') campaignRate = num(r.campaign_rate_custom);
    if(!campaignRate){
      const oldPrice = num(r.price), usd = num(r.budget_usd);
      const implied = usd > 0 ? oldPrice / usd : 0;
      campaignRate = implied || 1800;
    }
    r.campaign_rate_value = campaignRate;
    if((r.campaign_rate||'')!=='كتابة يدوياً') r.campaign_rate = String(campaignRate);
    r.price = num(r.budget_usd) * campaignRate;
    r.remaining = Math.max(0, r.price - num(r.paid));
    r.profit = calcProfit(r.paid, r.budget_iqd);
  } else if(section==='subscriptions'){
    r.remaining = Math.max(0, num(r.price) - num(r.paid));
    r.profit = calcProfit(r.paid, 0);
    if(r.start_date){
      const days = num(r.days_count) || 30;
      r.end_date = addDays(r.start_date, days);
      const end = new Date(r.end_date+'T00:00:00');
      const today = new Date(); today.setHours(0,0,0,0);
      r.days_left = Math.ceil((end-today)/86400000);
    } else { r.end_date=''; r.days_left=''; }
  } else if(section==='services'){
    r.remaining = Math.max(0, num(r.price) - num(r.paid));
    r.profit = calcProfit(r.paid, r.service_due);
  } else if(section==='debts'){
    r.total = num(r.design_debt)+num(r.promo_debt)+num(r.sub_debt)+num(r.service_debt);
  } else if(section==='partners'){
    const t = grandTotals();
    r.amount = num(r.percentage) * t.distributableProfit;
    r.withdrawal = partnerWithdrawalFromExpenses(row.name);
    r.remaining = Math.max(0, num(r.amount) - num(r.withdrawal));
  }
  return r;
}
function sectionSum(section, field){
  return (state[section]||[]).reduce((acc,row)=> acc + num(computeRow(section,row)[field]), 0);
}
function buildTotalsRow(section, cols, leadingLabel){
  const cells = cols.map(c=>{
    if((c.type==='number' || c.type==='calc') && !c.noSum){
      return `<td><b>${fmt(sectionSum(section,c.k))}</b></td>`;
    }
    return `<td></td>`;
  }).join('');
  return `<tr class="totals-row"><td><b>${leadingLabel||'المجموع'}</b></td>${cells}</tr>`;
}
function computeDebtsAuto(){
  const order = [['designs','design_debt'],['promotion','promo_debt'],['subscriptions','sub_debt'],['services','service_debt']];
  const map = {};
  order.forEach(([sec,key])=>{
    (state[sec]||[]).forEach(row=>{
      const name = normName(row.client);
      if(!name) return;
      const rem = num(computeRow(sec,row).remaining);
      if(!map[name]) map[name] = {client:row.client, design_debt:0, promo_debt:0, sub_debt:0, service_debt:0};
      map[name][key] += rem;
    });
  });
  return Object.values(map)
    .map(r=>({...r, total:r.design_debt+r.promo_debt+r.sub_debt+r.service_debt}))
    .filter(r=>r.total>0.001)
    .sort((a,b)=> b.total-a.total);
}
function applyIncomeAllocation(client, amount){
  const target = normName(client);
  let remainAmt = num(amount);
  if(!target || remainAmt<=0) return;
  const order = ['designs','promotion','subscriptions','services'];
  for(const sec of order){
    if(remainAmt<=0) break;
    const rows = state[sec]||[];
    for(const row of rows){
      if(remainAmt<=0) break;
      if(normName(row.client)!==target) continue;
      const rem = num(row.price) - num(row.paid);
      if(rem<=0) continue;
      const alloc = Math.min(rem, remainAmt);
      row.paid = num(row.paid) + alloc;
      remainAmt -= alloc;
    }
  }
}
// المبلغ المقبوض من العميل مسبقاً ("قبض من عميل") وما انصرف بعد على أي عمل له.
// هذا هو الرصيد اللي ينخصم منه تلقائياً لما يتسجل عمل جديد لنفس العميل.
function clientAvailableCredit(clientName){
  const target = normName(clientName);
  if(!target) return 0;
  const totalIncome = (state.income||[]).reduce((a,r)=> (r.income_type==='قبض من عميل' && normName(r.client)===target) ? a+num(r.amount) : a, 0);
  const workSections = ['designs','promotion','subscriptions','services'];
  const totalPaidAcrossWork = workSections.reduce((a,sec)=>
    a + (state[sec]||[]).reduce((b,row)=> normName(row.client)===target ? b+num(row.paid) : b, 0), 0);
  return Math.max(0, totalIncome - totalPaidAcrossWork);
}
function grandTotals(){
  const designProfit = sectionSum('designs','profit');
  const promoProfit = sectionSum('promotion','profit');
  const subProfit = sectionSum('subscriptions','profit');
  const serviceProfit = sectionSum('services','profit');
  const grossProfit = designProfit+promoProfit+subProfit+serviceProfit;

  const capitalIncome = (state.income||[]).reduce((a,r)=> r.income_type==='رأس مال' ? a+num(r.amount) : a, 0);
  const incomeFromClients = (state.income||[]).reduce((a,r)=> r.income_type!=='رأس مال' ? a+num(r.amount) : a, 0);

  const totalExpense = sectionSum('expenses','amount');
  const companyCampaigns = state.companyCampaigns||[];
  const companyCampaignsFromFunds = companyCampaigns.reduce((a,r)=> r.funding_source==='المال المتبقي' ? a+companyCampaignCost(r) : a, 0);
  const companyCampaignsFromProfit = companyCampaigns.reduce((a,r)=> r.funding_source==='صافي الربح' ? a+companyCampaignCost(r) : a, 0);
  const companyCampaignsFromCapital = companyCampaigns.reduce((a,r)=> r.funding_source==='رأس المال' ? a+companyCampaignCost(r) : a, 0);
  const expensesFromProfitGeneral = (state.expenses||[]).reduce((a,e)=>{
    if(e.source==='اجمالي الربح' && !isPartnerName(e.person)) return a+num(e.amount);
    return a;
  },0);
  const capitalWithdrawals = (state.expenses||[]).reduce((a,e)=> e.source==='رأس المال' ? a+num(e.amount) : a, 0);
  const capital = capitalIncome - capitalWithdrawals - companyCampaignsFromCapital;
  const distributableProfit = grossProfit - expensesFromProfitGeneral - companyCampaignsFromProfit;

  const availableFunds = grossProfit + capitalIncome - totalExpense - companyCampaignsFromFunds - companyCampaignsFromProfit;
  const totalDebts = computeDebtsAuto().reduce((a,r)=>a+num(r.total),0);
  const unclaimedPromo = (state.promotion||[]).reduce((a,r)=>{
    const cr = computeRow('promotion', r);
    return r.tayba_status==='لم تستلم' ? a+num(cr.budget_iqd) : a;
  },0);

  return {designProfit,promoProfit,subProfit,serviceProfit,grossProfit,capital,capitalIncome,capitalWithdrawals,incomeFromClients,totalExpense,distributableProfit,availableFunds,totalDebts,unclaimedPromo,companyCampaignsFromFunds,companyCampaignsFromProfit,companyCampaignsFromCapital};
}
function fmt(n){ n = num(n); return n.toLocaleString('en-US', {maximumFractionDigits:0}); }

function renderNav(){
  const nav = document.getElementById('tabsNav');
  nav.innerHTML = SECTIONS.map(s=>{
    let count = '';
    if(s.key!=='home' && s.key!=='settings' && s.key!=='stats'){
      const n = s.key==='debts' ? computeDebtsAuto().length : (state[s.key]||[]).length;
      count = `<span class="count">${n}</span>`;
    }
    return `<button class="tab-btn ${activeTab===s.key?'active':''}" data-tab="${s.key}">
      ${sectionIconHtml(s,' style="width:17px;height:17px;"')} <span>${s.label}</span> ${count}
    </button>`;
  }).join('');
  nav.querySelectorAll('.tab-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ activeTab=b.dataset.tab; render(); closeSidebarMobile(); });
  });
}

function render(){
  renderNav();
  const meta = SECTIONS.find(s=>s.key===activeTab);
  const title = meta.label;
  const sub = activeTab==='home' ? 'نظرة عامة على أداء الشركة'
    : activeTab==='settings' ? 'إدارة إعدادات الموقع والنسخ الاحتياطي'
    : activeTab==='stats' ? 'ابحث عن اسم عميل أو شريك لعرض كل بياناته'
    : activeTab==='debts' ? 'تُحسب هذه القائمة تلقائياً من المتبقي في جميع الأقسام'
    : `إدارة بيانات قسم ${meta.label}`;
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('pageSub').textContent = sub;

  const content = document.getElementById('content');
  if(activeTab==='home') content.innerHTML = renderHome();
  else if(activeTab==='settings'){ content.innerHTML = renderSettings(); bindSettings(); }
  else if(activeTab==='stats'){ content.innerHTML = renderStats(); bindStats(); }
  else if(activeTab==='debts'){ content.innerHTML = renderDebtsTable(); }
  else { content.innerHTML = renderTable(activeTab); bindTable(activeTab); }

  // إعادة تشغيل حركة الدخول في كل مرة يتغيّر فيها القسم
  content.classList.remove('content-enter');
  void content.offsetWidth; // إجبار المتصفح على إعادة الحساب (reflow) عشان تتكرر الحركة
  content.classList.add('content-enter');
}

      <div class="stat-card"><div class="stat-label">إجمالي الربح</div><div class="stat-value gold">${fmt(t.distributableProfit)}</div></div>
      <div class="stat-card hi"><div class="stat-label">المال المتبقي (الربح + رأس المال − الصرف)</div><div class="stat-value gold">${fmt(t.availableFunds)}</div></div>
      <div class="stat-card"><div class="stat-label">إجمالي الديون على العملاء</div><div class="stat-value neg">${fmt(t.totalDebts)}</div></div>
      ${customCards}

      <div class="breakdown">

function renderRecentOperations(){
  const items=[];
  (state.promotion||[]).slice(-5).reverse().forEach(r=>{ const cr=computeRow('promotion',r); items.push({date:r.date,icon:'📈',text:`ربح حملة ترويج: ${r.client||'—'}`,amount:num(cr.profit),neg:false}); });
  (state.designs||[]).slice(-5).reverse().forEach(r=>{ const cr=computeRow('designs',r); items.push({date:r.date,icon:'📈',text:`ربح تصميم: ${r.client||'—'}`,amount:num(cr.profit),neg:false}); });
  (state.subscriptions||[]).slice(-5).reverse().forEach(r=>{ const cr=computeRow('subscriptions',r); items.push({date:r.start_date,icon:'📈',text:`ربح اشتراك: ${r.client||'—'}`,amount:num(cr.profit),neg:false}); });
  (state.services||[]).slice(-5).reverse().forEach(r=>{ const cr=computeRow('services',r); items.push({date:r.date,icon:'📈',text:`ربح خدمة: ${r.client||'—'}`,amount:num(cr.profit),neg:false}); });
  (state.income||[]).slice(-5).reverse().forEach(r=>items.push({date:r.date,icon:'💰',text:`قبض: ${r.client||'—'}`,amount:num(r.amount),neg:false}));
  (state.expenses||[]).slice(-5).reverse().forEach(r=>items.push({date:r.date,icon:'💸',text:`صرف: ${r.reason||r.person||'—'}`,amount:num(r.amount),neg:true}));
  items.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const rows=items.slice(0,8).map(x=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);"><span style="font-size:18px">${x.icon}</span><div style="flex:1"><div style="font-weight:700;font-size:13px">${escapeHtml(x.text)}</div><div style="font-size:11px;color:var(--text-faint)">${fmtDate(x.date)||'—'}</div></div><strong class="${x.neg?'neg':'pos'}">${x.neg?'−':'+'}${fmt(Math.abs(x.amount))} د.ع</strong></div>`).join('');

}

function displayValue(section, col, row){
  if(section==='designs' && col.k==='design_type'){
    const extra = row.design_type2 ? ' + '+row.design_type2 : '';
    return `<td>${(row.design_type||'—')+extra}</td>`;
  }
  if(section==='designs' && col.k==='design_count'){
    const has2 = row.design_count2!=null && row.design_count2!=='';
    const extra = has2 ? ' + '+row.design_count2 : '';
    const base = (row.design_count!=null && row.design_count!=='') ? row.design_count : (has2?'0':'—');
    return `<td>${base+extra}</td>`;
  }
  const computed = computeRow(section, row);
  const v = computed[col.k];
  if(col.type==='calc'){
    if(col.k==='days_left'){
      if(v==='' || v==null) return '<td class="dim">—</td>';
      return v<0 ? `<td class="neg">منتهي (${Math.abs(v)} يوم)</td>` : `<td class="pos">${v} يوم</td>`;
    }
    if(col.k==='end_date') return `<td>${fmtDate(v)}</td>`;
    if(typeof v === 'number'){
      const cls = v<0 ? 'neg' : (v>0 ? 'pos' : 'dim');
      return `<td class="${cls}">${fmt(v)}</td>`;
    }
    return `<td>${v||'—'}</td>`;
  }
  if(col.type==='select'){
    if(col.k==='tayba_status'){
      const cls = v==='استلم' ? 'ok' : 'no';
      return `<td class="badge-cell"><span class="${cls}">${v||'—'}</span></td>`;
    }
    return `<td>${v||'—'}</td>`;
  }
  if(col.type==='percent'){
    return `<td>${v==='' || v==null ? '—' : Math.round(num(v)*1000)/10+'%'}</td>`;
  }
  if(col.type==='date'){
    return `<td>${fmtDate(v)||'—'}</td>`;
  }
  if(col.type==='number'){
    return `<td>${v===''||v==null ? '—' : fmt(v)}</td>`;
  }
  return `<td>${v||'—'}</td>`;
}

function renderCompanyCampaignsTable(){ return renderPromotionSection(); }

function renderTable(section){
  if(section==='promotion') return renderPromotionSection();
  if(section==='companyCampaigns') return renderCompanyCampaignsTable();
  const cols = getTableColumns(section);
  const rows = state[section]||[];
  const meta = SECTIONS.find(s=>s.key===section);
  const head = cols.map(c=>`<th style="${c.w?`min-width:${c.w}px`:''}">${c.label}</th>`).join('');
  const body = rows.map((row, idx)=>{
    const tds = cols.map(c=>displayValue(section, c, row)).join('');
    const quickAction = (section==='promotion' && row.tayba_status==='لم تستلم')
      ? `<span class="mini-link" data-mark-received="${idx}">تم الاستلام</span>` : '';
    return `<tr><td class="row-actions">
        <a class="edit-link" data-edit="${idx}">تعديل</a>
        ${quickAction}
        <a class="del-link" data-del="${idx}">${icon('trash',' style="width:13px;height:13px;"')} حذف</a>
      </td>${tds}</tr>`;
  }).join('');

  const unclaimedBar = section==='promotion' ? (()=>{
    const t = grandTotals();
    return t.unclaimedPromo>0 ? `<div class="notice-bar"><div>إجمالي مبالغ لم تُستلم من المروّج لكل العملاء</div><b>${fmt(t.unclaimedPromo)} د.ع</b></div>` : '';
  })() : '';

  return `
    ${unclaimedBar}
    <div class="section-card">
      <div class="section-head">
        <div class="section-title"><span class="swatch"></span>${meta.label} <span style="color:var(--text-faint);font-weight:500;font-size:12.5px;">(${rows.length} سجل)</span></div>
        ${section!=='partners' ? `<button class="btn" id="addRowBtn">${icon('plus')} إضافة عمل</button>` : ''}
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th></th>${head}</tr></thead>
          <tbody>${body || ''}</tbody>
          ${rows.length ? `<tfoot>${buildTotalsRow(section, cols)}</tfoot>` : ''}
        </table>
        ${rows.length===0 ? '<div class="empty-hint">لا توجد بيانات بعد — اضغط "إضافة عمل" للبدء</div>' : ''}
      </div>
    </div>
  `;
}

function bindTable(section){
  const content = document.getElementById('content');
  content.querySelectorAll('[data-promo-view]').forEach(el=>el.addEventListener('click', ()=>{ promotionView=el.dataset.promoView; render(); }));
  content.querySelector('#addRowBtn')?.addEventListener('click', ()=> openRowModal(section, null));
  const addCompanyBtn = content.querySelector('#addCompanyCampaignBtn');
  if(addCompanyBtn){
    addCompanyBtn.onclick = (e)=>{ e.preventDefault(); e.stopPropagation(); showCompanyCampaignModal({}); };
  }
  content.querySelectorAll('[data-edit]').forEach(el=>{
    el.addEventListener('click', ()=> openRowModal(section, parseInt(el.dataset.edit)));
  });
  content.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = parseInt(el.dataset.del);
      const row = state[section][i];
      const label = row.client || row.person || '';
      const confirmMsg = label ? `هل أنت متأكد من حذف "${label}"؟ لا يمكن التراجع عن هذا الإجراء.` : 'هل أنت متأكد من حذف هذا السجل؟ لا يمكن التراجع عن هذا الإجراء.';
      if(!confirm(confirmMsg)) return;

      const beforeTotals = grandTotals();
      state[section].splice(i,1);
      const afterTotals = grandTotals();
      render();
      setSaveStatus('saving');
      saveState().then(async ()=>{
        if(['designs','promotion','subscriptions','services'].includes(section)){
          await notifyTelegramEditDelete('delete', section, row, beforeTotals, afterTotals);
        }
      });
      showToast('تم الحذف');
    });
  });
  content.querySelectorAll('[data-mark-received]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = parseInt(el.dataset.markReceived);
      state[section][i].tayba_status = 'استلم';
      render();
      setSaveStatus('saving');
      saveState();
      showToast('تم تحديث حالة الاستلام');
    });
  });  content.querySelectorAll('[data-edit-company]').forEach(el=>{ el.addEventListener('click', ()=>{ modalSection='companyCampaigns'; modalEditIndex=parseInt(el.dataset.editCompany); const existing=state.companyCampaigns[modalEditIndex]||{}; document.getElementById('modalTitle').textContent='تعديل حملة للشركة'; document.getElementById('modalDone').textContent='حفظ التعديل'; document.getElementById('modalBody').innerHTML=buildCompanyCampaignModalBody(existing); bindCompanyCampaignModal(); document.getElementById('modalOverlay').classList.add('show'); }); });
  content.querySelectorAll('[data-del-company]').forEach(el=>{ el.addEventListener('click', ()=>{ const i=parseInt(el.dataset.delCompany); if(!confirm('هل أنت متأكد من حذف حملة الشركة؟')) return; state.companyCampaigns.splice(i,1); render(); setSaveStatus('saving'); saveState(); showToast('تم حذف حملة الشركة'); }); });

}

/* ===================== Add/Edit Modal ===================== */
let modalSection = null;
let modalEditIndex = null;
let promotionView = 'clients';
function adLinkRowHtml(value){
  const safe = (value||'').replace(/"/g,'&quot;');
  return `<div class="ad-link-row" style="display:flex;gap:8px;align-items:center;">
    <input type="text" class="ad-link-input" placeholder="اكتب الإعلان أو رابط المنشور..." value="${safe}" style="flex:1;background:var(--bg-soft);border:1px solid var(--border);color:var(--text);font-family:'Tajawal';font-size:14px;padding:10px 12px;border-radius:9px;">
    <button type="button" class="del-btn remove-ad-link">${icon('trash')}</button>
  </div>`;
}
function buildAdLinksFieldHtml(existingAdContent){
  const links = (existingAdContent||'').split('\n').map(s=>s.trim()).filter(Boolean);
  if(links.length===0) links.push('');
  const rows = links.map(v=>adLinkRowHtml(v)).join('');
  return `
    <div class="field">
      <label>الإعلان المراد ترويجه</label>
      <div id="adLinksContainer" style="display:flex;flex-direction:column;gap:8px;">${rows}</div>
      <span class="mini-link" id="addAdLinkBtn" style="margin-top:8px;display:inline-flex;align-items:center;gap:4px;">${icon('plus',' style="width:11px;height:11px;"')} إضافة إعلان آخر</span>
    </div>
  `;
}
function bindRemoveAdLinkButtons(){
  document.querySelectorAll('.remove-ad-link').forEach(btn=>{
    btn.onclick = ()=>{
      const container = document.getElementById('adLinksContainer');
      const row = btn.closest('.ad-link-row');
      if(container.children.length>1) row.remove();
      else row.querySelector('input').value = '';
    };
  });
}
function bindAdLinksField(){
  const container = document.getElementById('adLinksContainer');
  const addBtn = document.getElementById('addAdLinkBtn');
  if(!container || !addBtn) return;
  addBtn.addEventListener('click', ()=>{
    container.insertAdjacentHTML('beforeend', adLinkRowHtml(''));
    bindRemoveAdLinkButtons();
    const inputs = container.querySelectorAll('.ad-link-input');
    inputs[inputs.length-1].focus();
  });
  bindRemoveAdLinkButtons();
}
function buildPromotionModalBody(existing){
  const cols = getColumns('promotion').filter(c=>c.type!=='calc' && c.k!=='ad_content' && c.k!=='campaign_rate_custom');
  let html = `<div class="field"><label>نوع الحملة</label><select id="m_campaign_type"><option value="client" selected>حملة لعميل</option></select></div>`;
  cols.forEach(c=>{
    const id = 'm_'+c.k;
    let raw = existing[c.k];
    if(c.k==='tayba_status' && (raw==null || raw==='')) raw='لم تستلم';
    if(c.k==='date' && !raw) raw=new Date().toISOString().slice(0,10);
    if(c.k==='goal' && !raw) raw=PROMOTION_GOAL_OPTIONS[0];
    if(c.k==='platform' && !raw) raw=PLATFORM_OPTIONS[0];
    if(c.k==='exchange_rate' && !raw) raw=RATE_OPTIONS[0];
    if(c.k==='campaign_rate' && !raw) raw='1800';
    if(c.type==='select'){
      const opts = c.options.map(o=>`<option value="${o}" ${String(raw)===String(o)?'selected':''}>${o}</option>`).join('');
      html += `<div class="field"><label>${c.label}</label><select id="${id}">${opts}</select></div>`;
      if(c.k==='exchange_rate') html += `<div class="field"><label>ميزانية الحملة بالدينار</label><input type="text" id="m_budget_iqd" value="—" readonly></div>`;
      if(c.k==='campaign_rate'){
        const customVal = existing.campaign_rate_custom ?? '';
        html += `<div class="field" id="manualCampaignRateWrap" style="display:${raw==='كتابة يدوياً'?'block':'none'}"><label>سعر الحملة اليدوي</label><input type="number" step="any" id="m_campaign_rate_custom" value="${customVal}" placeholder="مثال: 1600"></div>`;
      }
    } else if(c.type==='percent'){
      const pct = raw==null || raw==='' ? '' : Math.round(num(raw)*1000)/10;
      html += `<div class="field"><label>${c.label}</label><input type="number" step="0.1" min="0" max="100" id="${id}" value="${pct}" placeholder="مثال: 25"></div>`;
    } else {
      const type = c.type==='number' ? 'number' : (c.type==='date' ? 'date' : 'text');
      const val = raw==null ? '' : raw;
      html += `<div class="field"><label>${c.label}</label><input type="${type}" ${type==='number'?'step="any"':''} id="${id}" value="${val}"></div>`;
    }
    if(c.k==='client_phone') html += buildAdLinksFieldHtml(existing.ad_content);
    if(c.k==='campaign_days') html += `<div class="field"><label>مدة الحملة</label><input type="text" id="m_days_label" value="${existing.campaign_days?existing.campaign_days+' يوم':''}" readonly></div>`;
  });
  html += `<div class="field"><label>سعر الحملة المحسوب</label><input type="text" id="m_price_preview" value="—" readonly></div>`;
  html += `<div class="field"><label>صافي الربح</label><input type="text" id="m_profit_preview" value="—" readonly></div>`;
  return html;
}

function openRowModal(section, idx){
  modalSection = section;
  modalEditIndex = idx;
  const existing = idx!=null ? state[section][idx] : {};
  const meta = SECTIONS.find(s=>s.key===section);
  document.getElementById('modalTitle').textContent = (idx!=null ? 'تعديل — ' : 'إضافة عمل جديد — ') + (meta?meta.label:'');
  document.getElementById('modalDone').textContent = idx!=null ? 'حفظ التعديل' : 'تم';

  if(section==='designs'){
    document.getElementById('modalBody').innerHTML = buildDesignsModalBody(existing);
    document.getElementById('addExtraDesignBtn')?.addEventListener('click', ()=>{
      document.getElementById('extraDesignFields').style.display='flex';
      document.getElementById('addExtraDesignBtn').style.display='none';
    });
  } else if(section==='promotion'){
    if(idx==null){
      // إضافة حملة لعميل تفتح نموذج الحملة مباشرة، بدون شاشة اختيار وسيطة.
      showPromotionClientModal({});
    } else {
      document.getElementById('modalBody').innerHTML=buildPromotionModalBody(existing);
      bindAdLinksField(); bindPromotionModal();
    }
  } else {
    const cols=getColumns(section).filter(c=>c.type!=='calc');
    document.getElementById('modalBody').innerHTML=cols.map(c=>{
      const id='m_'+c.k, raw=existing[c.k];
      if(c.type==='select') return `<div class="field"><label>${c.label}</label><select id="${id}">${c.options.map(o=>`<option value="${o}" ${raw===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
      const type=c.type==='number'?'number':(c.type==='date'?'date':'text');
      return `<div class="field"><label>${c.label}</label><input type="${type}" ${type==='number'?'step="any"':''} id="${id}" value="${raw==null?'':raw}"></div>`;
    }).join('');
  }
  document.getElementById('modalOverlay').classList.add('show');
  const first=document.getElementById('modalBody').querySelector('input,select,button');
  if(first) setTimeout(()=>first.focus(),60);
}

function bindCompanyCampaignModal(){
  const balanceForSource = ()=>{
    const t=grandTotals();
    const source=document.getElementById('m_company_funding')?.value || 'المال المتبقي';
    const partner=document.getElementById('m_company_partner')?.value || '';
    if(source==='شريك'){
      if(!partner) return 0;
      const p=(state.partners||[]).find(x=>normName(x.name)===normName(partner));
      if(!p) return 0;
      return Math.max(0, num(p.percentage)*t.distributableProfit - partnerWithdrawalFromExpenses(partner));
    }
    if(source==='رأس المال') return Math.max(0,t.capital);
    if(source==='صافي الربح') return Math.max(0,t.distributableProfit);
    return Math.max(0,t.availableFunds);
  };
  const update=()=>{
    const usd=num(document.getElementById('m_company_budget_usd')?.value);
    const ex=num(document.getElementById('m_company_exchange')?.value)||1380;
    const days=num(document.getElementById('m_company_days')?.value);
    const start=document.getElementById('m_company_start')?.value;
    const b=document.getElementById('m_company_budget_iqd'); if(b) b.value=usd?fmt(usd*ex)+' د.ع':'—';
    const dl=document.getElementById('m_company_days_label'); if(dl) dl.value=days?days+' يوم':'';
    const end=document.getElementById('m_company_end'); if(end) end.value=(start&&days)?addDays(start,Math.max(0,days-1)):'';
    const source=document.getElementById('m_company_funding')?.value || 'المال المتبقي';
    const partnerWrap=document.getElementById('companyPartnerWrap');
    if(partnerWrap) partnerWrap.style.display=source==='شريك'?'block':'none';
    const bal=document.getElementById('m_company_source_balance');
    if(bal){ const n=balanceForSource(); bal.value=fmt(n)+' د.ع'; bal.className=n>=usd*ex?'':'input-warning'; }
  };
  ['m_company_budget_usd','m_company_exchange','m_company_days','m_company_start','m_company_partner'].forEach(id=>document.getElementById(id)?.addEventListener('input',update));
  ['m_company_exchange','m_company_funding','m_company_partner','m_company_start'].forEach(id=>document.getElementById(id)?.addEventListener('change',update));
  update();
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  modalSection = null; modalEditIndex = null;
}
function submitModal(){
  if(!modalSection) return;
  const row = modalEditIndex!=null ? {...state[modalSection][modalEditIndex]} : {};
  if(modalSection==='designs'){
    const g = id=>{ const el = document.getElementById(id); return el ? el.value : ''; };
    row.client = g('m_client');
    row.client_phone = g('m_client_phone');
    row.design_type = g('m_design_type');
    row.design_count = g('m_design_count');
    row.design_type2 = g('m_design_type2');
    row.design_count2 = g('m_design_count2');
    row.price = g('m_price');
    row.paid = g('m_paid');
    row.designer_due = g('m_designer_due');
    row.date = g('m_date');
    row.notes = g('m_notes');
  } else if(modalSection==='promotion'){
    const cols = getColumns('promotion').filter(c=>c.type!=='calc' && c.k!=='ad_content');
    cols.forEach(c=>{
      const el = document.getElementById('m_'+c.k);
      let val = el ? el.value : '';
      if(c.type==='percent'){ val = val===''? '' : num(val)/100; }
      row[c.k] = val;
    });
    row.campaign_rate_custom = document.getElementById('m_campaign_rate_custom')?.value || '';
    const links = Array.from(document.querySelectorAll('.ad-link-input')).map(inp=>inp.value.trim()).filter(Boolean);
    row.ad_content = links.join('\n');
    row.campaign_type = 'client';
    if(!row.date) row.date = new Date().toISOString().slice(0,10);
  } else if(modalSection==='companyCampaigns'){
    row.name = document.getElementById('m_company_name')?.value || '';
    row.budget_usd = document.getElementById('m_company_budget_usd')?.value || '';
    row.exchange_rate = document.getElementById('m_company_exchange')?.value || '1380';
    row.budget_iqd = num(row.budget_usd)*num(row.exchange_rate);
    row.ad_content = document.getElementById('m_company_ad')?.value || '';
    row.days_count = document.getElementById('m_company_days')?.value || '';
    row.target = document.getElementById('m_company_target')?.value || 'ترويج';
    row.funding_source = document.getElementById('m_company_funding')?.value || 'المال المتبقي';
    row.partner_name = row.funding_source==='شريك' ? (document.getElementById('m_company_partner')?.value || '') : '';
    row.start_date = document.getElementById('m_company_start')?.value || '';
    row.end_date = row.start_date && num(row.days_count) ? addDays(row.start_date,Math.max(0,num(row.days_count)-1)) : '';
    row.status = document.getElementById('m_company_status')?.value || 'مخططة';
    row.actual_spent = row.actual_spent || '';
    row.views = row.views || '';
    row.reach = row.reach || '';
    row.messages = row.messages || '';
    row.clicks = row.clicks || '';
    row.engagements = row.engagements || '';
    row.leads = row.leads || '';
    row.notes = document.getElementById('m_company_notes')?.value || '';
  } else {
    const cols = getColumns(modalSection).filter(c=>c.type!=='calc');
    cols.forEach(c=>{
      const el = document.getElementById('m_'+c.k);
      let val = el ? el.value : '';
      if(c.type==='percent'){ val = val===''? '' : num(val)/100; }
      row[c.k] = val;
    });
  }
  const isNewRow = modalEditIndex==null;
  if(isNewRow && !row.id) row.id = Date.now().toString(36)+Math.random().toString(36).slice(2,8);

  let autoAllocInfo = null;
  if(isNewRow && ['designs','promotion','subscriptions','services'].includes(modalSection) && row.client){
    const credit = clientAvailableCredit(row.client);
    if(credit>0.001){
      const cr = computeRow(modalSection, row);
      const priceVal = num(cr.price);
      const alreadyPaid = num(row.paid);
      const remainingDue = Math.max(0, priceVal - alreadyPaid);
      const alloc = Math.min(credit, remainingDue);
      if(alloc>0.001){
        row.paid = alreadyPaid + alloc;
        autoAllocInfo = {alloc, remainingCredit: credit - alloc};
      }
    }
  }

  const beforeTotals = grandTotals();

  if(modalEditIndex!=null) state[modalSection][modalEditIndex] = row;
  else state[modalSection].push(row);

  if(modalSection==='income' && isNewRow && row.income_type==='قبض من عميل' && row.client){
    applyIncomeAllocation(row.client, row.amount);
  }

  const section = modalSection;
  const afterTotals = grandTotals();
  closeModal();
  activeTab = section==='companyCampaigns' ? 'promotion' : section;
  render();
  setSaveStatus('saving');

  // Save first, then send Telegram notifications using the final totals.
  saveState().then(async ()=>{
    if(isNewRow){
      const common = {
        section,
        allWorkText: buildTelegramAllWorkMessage(section, row),
        clientText: buildTelegramClientMessage(section, row),
        profitText: (section==='designs' ? buildTelegramDesignMessage(row,beforeTotals,afterTotals) :
                     section==='promotion' ? buildTelegramPromotionMessage(row,beforeTotals,afterTotals) :
                     section==='subscriptions' ? buildTelegramSubscriptionMessage(row,beforeTotals,afterTotals) :
                     section==='services' ? buildTelegramServiceMessage(row,beforeTotals,afterTotals) : ''),
        promotionText: section==='promotion' ? buildPromotionPromoterMessage(row) : ''
      };
      await notifyTelegramWork(common);
    } else if(['designs','promotion','subscriptions','services'].includes(section)){
      await notifyTelegramEditDelete('edit', section, row, beforeTotals, afterTotals);
    }
  });

  showToast(autoAllocInfo
    ? `${isNewRow ? 'تمت إضافة العمل' : 'تم حفظ التعديل'} — تم خصم ${fmt(autoAllocInfo.alloc)} د.ع من رصيد العميل المقبوض مسبقاً (المتبقي بالرصيد: ${fmt(autoAllocInfo.remainingCredit)} د.ع)`
    : (isNewRow ? 'تمت إضافة العمل' : 'تم حفظ التعديل'));

  if(isNewRow && section==='promotion'){
    const promoterPhone = row.promoter_phone || (state.settings && state.settings.promoterPhone) || '';
    openMessageModal([
      {label:'📩 رسالة للزبون', text: buildPromotionClientMessage(row), phone: row.client_phone},
      {label:'📋 رسالة للمروجة', text: buildPromotionPromoterMessage(row), phone: promoterPhone},
    ]);
  } else if(isNewRow && section==='companyCampaigns'){
    const promoterPhone = (state.settings && state.settings.promoterPhone) || '';
    openMessageModal([
      {label:'📋 رسالة للمروجة — تشغيل حملة الشركة', text: buildCompanyCampaignPromoterMessage(row), phone: promoterPhone}
    ]);
  } else if(isNewRow && section==='subscriptions'){
    openMessageModal([{label:'📩 رسالة للزبون', text: buildSubscriptionMessage(row), phone: row.client_phone}]);
  } else if(isNewRow && section==='designs'){
    openMessageModal([{label:'📩 رسالة للزبون', text: buildDesignsMessage(row), phone: row.client_phone}]);
  }
}

/* ===================== Client Statement (جرد الزبون) ===================== */
function buildClientStatement(name, from, to){
  const companyName = companyNameForMsg();
  const target = normName(name).toLowerCase();
  const match = v => !!target && normName(v).toLowerCase().includes(target);
  const inRange = d => { if(!from&&!to) return true; if(!d) return false; if(from&&d<from) return false; if(to&&d>to) return false; return true; };
  const sections = [
    {key:'designs', title:'التصاميم', dateField:'date'},
    {key:'promotion', title:'حملات الترويج', dateField:'date'},
    {key:'subscriptions', title:'الاشتراكات', dateField:'start_date'},
    {key:'services', title:'الخدمات', dateField:'date'},
  ];
  let totalPrice=0, totalPaid=0, phone='';
  let sectionsText='';
  sections.forEach(s=>{
    const rows=(state[s.key]||[]).filter(r=>match(r.client)&&inRange(r[s.dateField]));
    if(!rows.length) return;
    if(!phone){ const withPhone=rows.find(r=>r.client_phone); if(withPhone) phone=withPhone.client_phone; }
    let secPrice=0, secBudgetUsd=0;
    const lines=rows.map((r,i)=>{
      const cr=computeRow(s.key,r);
      secPrice+=num(cr.price); totalPaid+=num(r.paid);
      const d=fmtDate(r[s.dateField])||'—';
      const amountLabel = (s.key==='promotion' && r.budget_usd) ? `$ ${fmt(r.budget_usd)}` : `${fmt(cr.price)} د.ع`;
      if(s.key==='promotion') secBudgetUsd+=num(r.budget_usd);
      let statusLabel = '';
      if(s.key==='subscriptions' && cr.days_left !== '' && cr.days_left !== undefined){
        statusLabel = cr.days_left <= 0 ? ' — ❌ منتهي' : ` — ⏳ باقي ${cr.days_left} يوم (ينتهي ${fmtDate(cr.end_date)})`;
      }
      return `${i+1}. بتاريخ ${d} — الميزانية ${amountLabel}${statusLabel}`;
    }).join('\n');
    totalPrice+=secPrice;
    const totalLabel = (s.key==='promotion' && secBudgetUsd) ? `$ ${fmt(secBudgetUsd)}` : `${fmt(secPrice)} د.ع`;
    sectionsText += `\n📁 ${s.title} (${rows.length}):\n${lines}\nمجموع ${s.title}: ${totalLabel}\n`;
  });
  const debtRow=(state.debts||[]).find(r=>match(r.client));
  const prevDebt = debtRow ? num(computeRow('debts',debtRow).total) : 0;
  const balance = totalPrice + prevDebt - totalPaid;
  let finalLine;
  if(balance>0) finalLine = `📌 عليكم مبلغ: ${fmt(balance)} د.ع`;
  else if(balance<0) finalLine = `📌 لكم رصيد زائد: ${fmt(Math.abs(balance))} د.ع`;
  else finalLine = `✅ الحساب مسدد بالكامل`;
  const debtLine = prevDebt>0 ? `\n📌 دين سابق مسجل: ${fmt(prevDebt)} د.ع` : '';
  const availableCredit = clientAvailableCredit(name);
  const creditLine = availableCredit>0.001 ? `\n💳 رصيد مقبوض غير مستخدم: ${fmt(availableCredit)} د.ع` : '';
  const periodLine = (from||to) ? `${from||'البداية'} إلى ${to||'اليوم'}` : 'كامل السجل';
  const text = `📊 جرد حساب
${companyName}
━━━━━━━━━━━━━━━━
👤 الزبون: ${name}
📅 الفترة: ${periodLine}
━━━━━━━━━━━━━━━━${sectionsText || '\nلا توجد أعمال مسجلة ضمن هذه الفترة\n'}━━━━━━━━━━━━━━━━
💰 إجمالي قيمة الأعمال: ${fmt(totalPrice)} د.ع
💵 إجمالي المدفوع: ${fmt(totalPaid)} د.ع${debtLine}${creditLine}
━━━━━━━━━━━━━━━━
${finalLine}
━━━━━━━━━━━━━━━━
📢 ${companyName}`;
  return {text, phone};
}

/* ===================== WhatsApp helpers ===================== */
function normalizePhone(phone){
  let p = (phone||'').toString().trim().replace(/[^0-9+]/g,'');
  if(!p) return '';
  if(p.startsWith('+')) p = p.slice(1);
  if(p.startsWith('00')) p = p.slice(2);
  if(p.startsWith('0')) p = '964'+p.slice(1);
  else if(!p.startsWith('964')) p = '964'+p;
  return p;
}
function buildWaLink(phone, text){
  const p = normalizePhone(phone);
  if(!p) return null;
  return `https://wa.me/${p}?text=${encodeURIComponent(text)}`;
}
function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    showToast('تم نسخ الرسالة');
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('تم نسخ الرسالة');
    }catch(err){ showToast('تعذر نسخ الرسالة'); }
  }
}
/* items: [{label, text, phone}] — phone is optional; when present shows a WhatsApp send button */
function openMessageModal(items){
  if(typeof items === 'string') items = [{label:'الرسالة', text:items}];
  const body = document.getElementById('msgModalBody');
  body.innerHTML = items.map((it,i)=>{
    const waLink = it.phone ? buildWaLink(it.phone, it.text) : null;
    const waBtn = waLink
      ? `<a class="btn sm whatsapp" href="${waLink}" target="_blank" rel="noopener" style="text-decoration:none;">📲 إرسال عبر واتساب</a>`
      : `<span class="btn sm ghost" style="opacity:.5;cursor:not-allowed;" title="لا يوجد رقم هاتف محفوظ لهذه الرسالة">📲 إرسال عبر واتساب</span>`;
    return `<div class="msg-block">
      <div class="msg-block-label">${escapeHtml(it.label||'')}</div>
      <pre data-msg-idx="${i}">${escapeHtml(it.text)}</pre>
      <div class="msg-block-actions">
        <button class="btn sm ghost" data-copy-idx="${i}">${icon('copy',' style="width:12px;height:12px;"')} نسخ الرسالة</button>
        ${waBtn}
      </div>
    </div>`;
  }).join('');
  body.querySelectorAll('[data-copy-idx]').forEach(btn=>{
    btn.addEventListener('click', ()=> copyText(items[parseInt(btn.dataset.copyIdx)].text));
  });
  document.getElementById('msgModalOverlay').classList.add('show');
}
function closeMessageModal(){
  document.getElementById('msgModalOverlay').classList.remove('show');
}

  if(q.type==='all'||q.type==='company'){

    if(rows.length){matchCount+=rows.length; totalCompanyCost=rows.reduce((a,r)=>a+num(r.actual_spent||r.budget_iqd||num(r.budget_usd)*num(r.exchange_rate)),0); blocks+=`<div class="client-block"><h4><span class="swatch"></span>حملات الشركة (${rows.length})</h4><div class="table-wrap"><table><thead><tr><th>اسم الحملة</th><th>الميزانية $</th><th>التكلفة د.ع</th><th>مصدر الصرف</th><th>المدة</th><th>البدء</th><th>النهاية</th><th>الحالة</th><th>المشاهدات</th><th>الوصول</th><th>الرسائل</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.name||'—'}</td><td>${r.budget_usd||'—'}</td><td>${fmt(r.budget_iqd||num(r.budget_usd)*num(r.exchange_rate))}</td><td>${r.funding_source||'—'}</td><td>${r.days_count?r.days_count+' يوم':'—'}</td><td>${fmtDate(r.start_date)||'—'}</td><td>${fmtDate(r.end_date)||'—'}</td><td>${r.status||'مخططة'}</td><td>${r.views?fmt(r.views):'—'}</td><td>${r.reach?fmt(r.reach):'—'}</td><td>${r.messages?fmt(r.messages):'—'}</td></tr>`).join('')}</tbody></table></div></div>`;}
  }
  if(q.type==='all'||q.type==='partners'){
    const ps=(state.partners||[]).filter(p=>match(p.name));
    if(ps.length){matchCount+=ps.length; blocks+=`<div class="client-block"><h4><span class="swatch"></span>الشركاء (${ps.length})</h4><div class="table-wrap"><table><thead><tr><th>الشريك</th><th>النسبة</th><th>الحصة</th><th>المسحوب</th><th>المتبقي</th></tr></thead><tbody>${ps.map(p=>{const r=computeRow('partners',p);return `<tr><td>${p.name}</td><td>${Math.round(num(p.percentage)*1000)/10}%</td><td>${fmt(r.amount)}</td><td>${fmt(r.withdrawal)}</td><td>${fmt(r.remaining)}</td></tr>`}).join('')}</tbody></table></div></div>`;}
  }
  if(!matchCount)return formHtml+'<div class="empty-hint">لا توجد عمليات ضمن الفلتر المحدد.</div>';
  const canStatement = !!q.name && (q.type==='all'||q.type==='customers');
  const statementBtn = canStatement ? `<button class="btn sm" id="genStatementBtn" style="margin-top:10px;">${icon('copy',' style="width:12px;height:12px;"')} تجهيز جرد حساب للزبون</button>` : '';
  let creditCard='', subStatusCard='';
  if(canStatement){
    const availableCredit = clientAvailableCredit(q.name);
    if(availableCredit>0.001) creditCard = `<div class="stat-card"><div class="stat-label">رصيد متاح للعميل</div><div class="stat-value pos">${fmt(availableCredit)}</div></div>`;
    const subRows = (state.subscriptions||[]).filter(r=>match(r.client));
    if(subRows.length){
      const latest = subRows.slice().sort((a,b)=>(b.start_date||'').localeCompare(a.start_date||''))[0];
      const cr = computeRow('subscriptions', latest);
      if(cr.days_left!==''&&cr.days_left!=null){
        subStatusCard = cr.days_left<=0
          ? `<div class="stat-card"><div class="stat-label">حالة الاشتراك</div><div class="stat-value neg">منتهي (${fmtDate(cr.end_date)})</div></div>`
          : `<div class="stat-card"><div class="stat-label">حالة الاشتراك</div><div class="stat-value pos">باقي ${cr.days_left} يوم</div></div>`;
      }
    }
  }
  return formHtml+`<div class="notice-bar"><b>${q.type==='company'?'حملات الشركة':q.type==='partners'?'بيانات الشركاء':q.name?'نتائج العميل: '+escapeHtml(q.name):'كل العمليات حسب التاريخ'}</b><span>${q.from||'—'} إلى ${q.to||'—'}</span></div><div class="search-summary"><div class="stat-card"><div class="stat-label">صافي الربح</div><div class="stat-value gold">${fmt(totalProfit)}</div></div><div class="stat-card"><div class="stat-label">إجمالي القبض</div><div class="stat-value pos">${fmt(totalIncome)}</div></div><div class="stat-card"><div class="stat-label">إجمالي الصرف</div><div class="stat-value neg">${fmt(totalExpense)}</div></div><div class="stat-card"><div class="stat-label">تكلفة حملات الشركة</div><div class="stat-value neg">${fmt(totalCompanyCost)}</div></div>${creditCard}${subStatusCard}</div>${statementBtn}${blocks}`;
}

function bindSettings(){

    applyBranding();
    setSaveStatus('saving');
    saveState();
    showToast('تم حفظ التغييرات');
  });
  document.getElementById('resetLogoBtn').addEventListener('click', ()=>{
    state.settings.logoDataUrl = null;
    document.getElementById('logoPreviewImg').src = DEFAULT_LOGO;

    setSaveStatus('saving');
    saveState();
    showToast('تم استخدام الشعار الافتراضي');
  });
  document.getElementById('logoFileInput').addEventListener('change', (e)=>{

      state.settings.logoDataUrl = reader.result;
      document.getElementById('logoPreviewImg').src = reader.result;

      setSaveStatus('saving');
      saveState();
      showToast('تم رفع الشعار الجديد');

    saveState();
    showToast('تم حفظ رسالة الزبون');

  document.getElementById('resetTplClientBtn').addEventListener('click', ()=>{
    state.messageTemplates.promotion_client = null;
    document.getElementById('tplPromotionClient').value = defaultPromotionClientTemplate();
    setSaveStatus('saving');
    saveState();
    showToast('تمت استعادة رسالة الزبون الافتراضية');
  });
  document.getElementById('saveTplPromoterBtn').addEventListener('click', ()=>{
    const val = document.getElementById('tplPromotionPromoter').value;
    state.messageTemplates.promoter = val.trim() ? val : null;
    setSaveStatus('saving');
    saveState();
    showToast('تم حفظ رسالة المروج');
  });
  document.getElementById('resetTplPromoterBtn').addEventListener('click', ()=>{
    state.messageTemplates.promoter = null;
    document.getElementById('tplPromotionPromoter').value = defaultPromotionPromoterTemplate();
    setSaveStatus('saving');
    saveState();
    showToast('تمت استعادة رسالة المروج الافتراضية');

  });
  document.getElementById('savePartnerPctBtn').addEventListener('click', ()=>{
    document.querySelectorAll('[data-partner-pct]').forEach(inp=>{
      const idx = parseInt(inp.dataset.partnerPct);
      state.partners[idx].percentage = num(inp.value)/100;
    });
    render();
    setSaveStatus('saving');
    saveState();
    showToast('تم حفظ النسب');
  });
  document.getElementById('addStatBtn').addEventListener('click', ()=>{
    const label = document.getElementById('newStatLabel').value.trim();
    const value = document.getElementById('newStatValue').value;
    if(!label) return;
    state.customStats.push({id:Date.now(), label, value:num(value)});
    render();
    setSaveStatus('saving');
    saveState();
    showToast('تمت إضافة الخانة');
  });
  document.querySelectorAll('[data-del-stat]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.customStats.splice(parseInt(el.dataset.delStat),1);
      render(); setSaveStatus('saving'); saveState();
    });
  });
  document.getElementById('addColBtn')?.addEventListener('click', ()=>{
    const section = document.getElementById('newColSection').value;
    const label = document.getElementById('newColLabel').value.trim();
    if(!label) return;
    if(!state.customColumns[section]) state.customColumns[section]=[];
    state.customColumns[section].push({key:'c_'+Date.now(), label});
    render();
    setSaveStatus('saving');
    saveState();
    showToast('تمت إضافة الخانة للقسم');
  });
  document.querySelectorAll('[data-del-col]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [sec,i] = el.dataset.delCol.split('|');
      state.customColumns[sec].splice(parseInt(i),1);
      render(); setSaveStatus('saving'); saveState();
    });
  });
  document.querySelectorAll('[data-icon-file]').forEach(input=>{
    input.addEventListener('change', ()=>{
      const file = input.files && input.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        if(!state.settings.sectionIcons) state.settings.sectionIcons = {};
        state.settings.sectionIcons[input.dataset.iconFile] = {type:'image', dataUrl:reader.result};
        const preview = document.querySelector(`[data-icon-preview="${input.dataset.iconFile}"]`);
        if(preview) preview.innerHTML = `<img src="${reader.result}" style="width:24px;height:24px;object-fit:contain;">`;
        setSaveStatus('saving');
        saveState();
        showToast('تم رفع صورة الأيقونة');
      };
      reader.readAsDataURL(file);
      input.value = '';
    });
  });
  document.querySelectorAll('[data-icon-reset]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const sec = btn.dataset.iconReset;
      const meta = SECTIONS.find(s=>s.key===sec);
      if(!meta) return;
      if(!state.settings.sectionIcons) state.settings.sectionIcons = {};
      state.settings.sectionIcons[sec] = meta.icon;
      render();
      setSaveStatus('saving');
      saveState();
      showToast('تمت إعادة الأيقونة الافتراضية');
    });
  });
  document.querySelectorAll('[data-icon-section]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      if(!state.settings.sectionIcons) state.settings.sectionIcons = {};
      state.settings.sectionIcons[sel.dataset.iconSection] = sel.value;
      const preview = document.querySelector(`[data-icon-preview="${sel.dataset.iconSection}"]`);
      if(preview) preview.innerHTML = icon(sel.value,' style="width:19px;height:19px;"');
      setSaveStatus('saving');
      saveState();
    });
  });
  document.getElementById('saveIconsBtn').addEventListener('click', ()=>{
    render();
    setSaveStatus('saving');
    saveState();
    showToast('تم حفظ الأيقونات');
  });
  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'العين-نسخة-احتياطية.json'; a.click();
    URL.revokeObjectURL(url);
  });
  document.getElementById('importFile').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const data = JSON.parse(reader.result);
        state = withDefaults(data);
        render();
        applyBranding();
        setSaveStatus('saving');
        await saveState();
        showToast('تم استيراد البيانات بنجاح');
      }catch(err){ showToast('ملف غير صالح'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  });
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    if(confirm('هل أنت متأكد من حذف جميع البيانات في كل الأقسام؟ لا يمكن التراجع عن هذا الإجراء.')){
      const keepSettings = state.settings;
      state = structuredClone(EMPTY_STATE);
      state.settings = keepSettings;
      render();
      setSaveStatus('saving');
      saveState();
      showToast('تمت إعادة تعيين البيانات');
    }
  });
}

/* ===================== Theme (Dark/Light) ===================== */
function applyTheme(theme){
  if(theme==='dark'){
    document.documentElement.setAttribute('data-theme','dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  try{ localStorage.setItem('oyoun-theme', theme); }catch(e){}
  const iconEl = document.getElementById('themeToggleIcon');
  const labelEl = document.getElementById('themeToggleLabel');
  if(iconEl) iconEl.innerHTML = icon(theme==='dark' ? 'sun' : 'moon');
  if(labelEl) labelEl.textContent = theme==='dark' ? 'الوضع النهاري' : 'الوضع الليلي';
}
function currentTheme(){
  return document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light';
}
document.getElementById('themeToggleBtn').addEventListener('click', ()=>{
  applyTheme(currentTheme()==='dark' ? 'light' : 'dark');
});

/* ===================== Boot ===================== */
function closeSidebarMobile(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}
document.getElementById('menuToggle').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('show');
});
document.getElementById('backdrop').addEventListener('click', closeSidebarMobile);

async function refreshFromServer(manual){
  try{
    const snap = await dataRef.once('value');
    if(snap.exists()){
      const incoming = withDefaults(snap.val());
      if(JSON.stringify(incoming) !== JSON.stringify(state)){
        state = incoming;
        render();
        applyBranding();
        if(manual) showToast('تم تحديث البيانات');
      } else if(manual){
        showToast('البيانات محدّثة بالفعل');
      }
    }
  }catch(e){ if(manual) showToast('تعذر التحديث'); }
}
document.getElementById('refreshBtn').addEventListener('click', ()=>refreshFromServer(true));

(async function init(){
  applyTheme(currentTheme());
  document.getElementById('splashLogo').src = DEFAULT_LOGO;
  document.getElementById('sidebarLogo').src = DEFAULT_LOGO;
  const start = Date.now();
  await loadState();
  lastSavedAvailableFunds = Number(grandTotals().availableFunds || 0);
  applyBranding();
  render();
  const elapsed = Date.now()-start;
  const wait = Math.max(0, 1100-elapsed);
  setTimeout(()=>{ document.getElementById('splash').classList.add('hide'); }, wait);
  listenForRemoteChanges();
})();
</script>
